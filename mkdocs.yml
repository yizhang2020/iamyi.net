site_name: iamyi.net
site_url: https://iamyi.net
site_description: Personal profile and writings about security.
site_author: Yi Zhang
repo_url: https://github.com/yizhang2020/iamyi.net
repo_name: iamyi.net

copyright: Copyright &copy; 2026 Yi Zhang &mdash; Unless noted otherwise, content is licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.

hooks:
  - mkdocs_hooks.py  

# Extra paths for `mkdocs serve` livereload (in addition to docs/ and mkdocs.yml).
# We watch `overrides/` for theme templates; `tools/` and hook files are not watched to avoid
# noisy rebuilds when editing generators. For those, edit mkdocs.yml or use start.sh’s restart.

watch:
  - overrides 

extra_css:
  - stylesheets/tables.css
  - stylesheets/minibook.css
  - stylesheets/whoami.css
  - stylesheets/nav-tabs.css
  - stylesheets/site-polish.css
  - stylesheets/home-browse.css
  - stylesheets/talk-viewer.css

docs_dir: docs
site_dir: site

validation:
  nav:
    omitted_files: ignore
    absolute_links: ignore

plugins:
  - awesome-pages
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
      enable_git_follow: false

# Authoring aid only; not a published page.
exclude_docs: |
  incidents/_template-incident-note.md
  incidents/materials/**
  includes/latest-writing.md
  includes/home-browse.md
  # Local WIP minibooks (gitignored; not published)
  minibooks/hackers-mindset/**
  minibooks/ai-security-book-review/**

theme:
  name: material
  custom_dir: overrides
  # Readable editorial pair — not the default Roboto stack.
  font:
    text: Source Sans 3
    code: IBM Plex Mono
  # Teal + amber: calm, readable, a bit more “personal site” than default indigo.
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber 
      toggle: 
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Top-level sections as tabs under the header; sidebar is that section’s tree.
    - navigation.tabs
    - navigation.tabs.sticky
    # Accordion sidebar: active path starts open; opening one nest closes siblings
    # (see docs/javascripts/nav-accordion.js). Do not use navigation.expand.
    - navigation.indexes
    - navigation.top 

extra_javascript:
  - javascripts/nav-accordion.js
  - javascripts/talk-viewer.js

markdown_extensions:
    - meta
    - attr_list
    - pymdownx.snippets:
        base_path: docs
    - pymdownx.superfences
    - pymdownx.highlight

