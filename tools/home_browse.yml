essay_summaries:
  systematic-approach-on-product-security.md: Turn shift-left ideals into repeatable product-security practice across phases and priorities.
  security-tasks-prioritization.md: How capable engineers prioritize macro security work and micro risk signals.
  guardrails-and-security-engineers-role.md: Four security-engineer roles from observer to gatekeeper—and how much each steers delivery.
  security-as-coding-intelligence.md: Why AI-era development needs security as embedded rules and intentional friction.
  understanding-vulnerability-threat-and-risk.md: Threat, vulnerability, and risk as a usable mental model—not interchangeable labels.
  from-mental-model-to-security-model.md: Move from “how the system works” to “how it can fail” in reviews.
  threat-modeling-car-firmware-update-via-usb-stick.md: USB firmware-update case study—structured threats beyond sign-and-encrypt.
  build-security-code-review-confidence-from-uncertain-to-certain.md: A path from ambiguous code to defensible review confidence.
  security-code-review-trend-and-practice-in-ai-era.md: Evidence and operating model for LLM-assisted review without abandoning human judgment.
  how-to-end-to-end-mlmodel-and-genai-application-security.md: Lifecycle checklist for securing ML and GenAI applications end to end.
  study-note-the-developers-playbook-for-large-language-model-security.md: Personal study companion to Wilson’s LLM security playbook (not a substitute for the book).
  study-note-prompt-engineering.md: Notes on prompt/context engineering—what LLMs do and do not “understand.”
  research-china-pipl-us-padfaa-doj-dsp-compliance.md: Working comparison of China PIPL and U.S. PADFAA / DOJ DSP for vendor and eng roles.
  template-security-architecture-review.md: Reusable outline for application security architecture reviews.

